<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lusia Goia Turismo</title>
<meta name="description" content="Viagens, clientes, fornecedores, recebimentos e pagamentos da Lusia.">
<meta name="theme-color" content="#81D8D0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lusia Goia Turismo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Tema claro, azul Tiffany. Layout: app de uma coluna (máx. 760px), barra de abas fixa embaixo, formulários em "gaveta" que sobe da base. Viagens desenhadas como passagem com canhoto da data. Nada externo: funciona offline. */
:root{
  --bg:#F2FBFA; --surface:#FFFFFF; --surface2:#F6FCFC; --ink:#0F2E2C; --muted:#557371; --line:#D3EEEB;
  --brand:#81D8D0; --brand-ink:#063F3B; --brand-soft:#E2F6F4; --brand-text:#0D7A74; --tiffany:#81D8D0;
  --sun:#81D8D0; --sun-soft:#E2F6F4; --sun-ink:#063F3B;
  --good:#1D7F49; --good-soft:#DDF1E5; --bad:#B93C12; --bad-soft:#FBE3D9; --warn:#8A5A00; --warn-soft:#FDF3DC;
  --scrim:rgba(6,40,38,.35); --shadow:0 1px 2px rgba(15,46,44,.05),0 6px 18px rgba(15,46,44,.07);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  --display:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand-text);outline-offset:2px}
.ico{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.t-good{color:var(--good)} .t-bad{color:var(--bad)} .t-muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.brand{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1}
.brand span{color:var(--brand-text)}
.sub{color:var(--muted);font-size:15px;margin-top:4px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800}
h2{font-size:21px;font-weight:800}
h3{font-size:18px;font-weight:700}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.count{background:var(--brand-soft);color:var(--brand-text);font-weight:700;border-radius:999px;padding:2px 12px;font-size:15px}

/* Botões */
.btn{min-height:56px;border-radius:14px;border:0;font-weight:700;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 20px;text-decoration:none;transition:transform .08s;text-align:center}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn.sec{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.big{width:100%;min-height:64px;font-size:20px}
.btn.sm{min-height:44px;font-size:16px;padding:0 14px;border-radius:12px}
.btn.sq{width:56px;padding:0;flex:none}
.voice{background:var(--sun);color:var(--brand-ink);min-height:58px;border-radius:999px;padding:0 22px 0 18px;font-size:19px;box-shadow:var(--shadow)}
.voice .ico{width:26px;height:26px}
.iconbtn{width:52px;height:52px;border-radius:14px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none;border:2px solid var(--line)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow>.btn{flex:1 1 150px}

/* Avisos */
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--warn-soft);color:var(--ink);font-size:16px}
.banner .ico{color:var(--warn)}
.banner p{margin:0;flex:1 1 200px}
.banner.info{background:var(--brand-soft)} .banner.info .ico{color:var(--brand-text)}
.aviso{padding:10px 14px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-weight:700;font-size:16px}
.aviso.ok{background:var(--good-soft);color:var(--good)}
.hint{color:var(--muted);font-size:15px;margin:0}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:18px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{margin:0;color:var(--muted)}
.welcome{background:var(--surface);border-radius:22px;padding:26px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.welcome p{margin:0;color:var(--muted)}
.card{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.status{display:flex;align-items:center;gap:10px;font-weight:700}
.status i{width:12px;height:12px;border-radius:50%;background:var(--muted);flex:none}
.status.on i{background:var(--good)} .status.err i{background:var(--bad)}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.code{width:100%;min-height:110px;font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:pre;overflow:auto}

/* Indicadores */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.tile{background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .tl{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--muted);font-size:15px;text-transform:uppercase;letter-spacing:.05em}
.tile .tv{font-family:var(--display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;line-height:1.15}
.tile small{color:var(--muted);font-size:15px}
.tile.rec .tl .ico{color:var(--good)} .tile.pag .tl .ico{color:var(--bad)} .tile.luc .tl .ico{color:var(--brand-text)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:var(--shadow)}
.kpi span{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi b{font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi small{color:var(--muted);font-size:14px}
.kpi.lucro{background:var(--brand);color:var(--brand-ink)} .kpi.lucro span,.kpi.lucro small{color:var(--brand-ink);opacity:.85}
.kpi.lucro.neg{background:var(--bad);color:#fff} .kpi.lucro.neg span,.kpi.lucro.neg small{color:#fff}

.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;flex:1;min-width:40px}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--good)}
.bar i.brand{background:var(--brand)}
.bar.big{height:16px;border-radius:9px}
.prog{background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.pl{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.pl span{font-weight:700}
.pl b{font-variant-numeric:tabular-nums}
.pl small{color:var(--muted);font-weight:400}

/* Passagem (cartão de viagem) */
.ticket{display:grid;grid-template-columns:86px 1fr;background:var(--surface);border-radius:18px;position:relative;overflow:hidden;box-shadow:var(--shadow);border:0;padding:0;text-align:left;width:100%}
.ticket::before,.ticket::after{content:"";position:absolute;left:77px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.ticket::before{top:-9px} .ticket::after{bottom:-9px}
.stub{background:var(--tiffany);color:#053331;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 4px;border-right:2px dashed var(--surface);gap:2px}
.stub .d{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.stub .m{text-transform:uppercase;letter-spacing:.12em;font-size:14px;font-weight:700}
.stub .y{font-size:13px;opacity:.8}
.stub.passada{background:var(--line);color:var(--muted)}
.tbody{padding:12px 14px 14px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tdest{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15;overflow-wrap:anywhere}
.tmeta{color:var(--muted);font-size:15px}
.tstats{display:flex;gap:14px;flex-wrap:wrap;font-weight:700;font-size:16px;align-items:center}
.tstats span{display:inline-flex;gap:6px;align-items:center}
.tstats .ico{width:20px;height:20px}
.mini{display:grid;grid-template-columns:76px 1fr 42px;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.mini span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.list{display:flex;flex-direction:column;gap:10px}

/* Vencimentos */
.venc{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
.vdate{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface2);border-radius:12px;min-height:56px;border:2px solid var(--line)}
.vdate b{font-family:var(--display);font-size:22px;line-height:1}
.vdate span{text-transform:uppercase;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.venc.late .vdate{border-color:var(--bad);background:var(--bad-soft)}
.venc.late .vdate span{color:var(--bad)}
.vinfo{min-width:0}
.vq{font-weight:700;overflow-wrap:anywhere}
.vo{color:var(--muted);font-size:14px}
.vval{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.vval>div{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Segmentos e chips */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-radius:14px;padding:4px;gap:4px;border:2px solid var(--line)}
.seg button{min-height:48px;border:0;border-radius:10px;background:transparent;font-weight:700;font-size:16px;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--brand);border-color:var(--brand-text);color:var(--brand-ink)}
.chip.add{border-style:dashed;color:var(--brand-text)}
.chip:disabled{opacity:.35;cursor:default}
.chip.tall{flex-direction:column;justify-content:center;align-items:flex-start;padding:6px 16px;border-radius:14px;min-height:60px;gap:0}
.chip.tall small{font-weight:400;font-size:14px;opacity:.85}
.chip.n{min-width:52px;justify-content:center;padding:0 10px}

/* Linhas de lista */
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);border:0;text-align:left;width:100%;min-height:68px}
.card .row{box-shadow:none;border:2px solid var(--line)}
.rmain{min-width:0;display:flex;flex-direction:column;gap:2px}
.rt{font-weight:700;font-size:18px;overflow-wrap:anywhere}
.rs{color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.rend{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-variant-numeric:tabular-nums}
.rend b{white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);display:block}
.dots i.p{background:var(--good);border-color:var(--good)}
.dots i.l{border-color:var(--bad);background:var(--bad-soft)}
.forn{display:flex;flex-direction:column;gap:8px;background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.forn>button{background:none;border:0;text-align:left;padding:0;display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:48px}
.phones{display:flex;flex-wrap:wrap;gap:8px}
.phone{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);font-weight:700;font-variant-numeric:tabular-nums;text-decoration:none;color:var(--ink)}
.phone .ico{width:18px;height:18px;color:var(--brand-text)}
.phone.wa{background:#25D366;border-color:#25D366;color:#06301A}
.phone.wa .ico{color:#06301A}
.group{display:flex;flex-direction:column;gap:8px}
.ghead{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:4px 2px 0}
.ghead h3{display:flex;align-items:center;gap:8px}
.ghead b{font-variant-numeric:tabular-nums}

/* Busca */
.search{position:relative}
.search>.ico{position:absolute;left:14px;top:16px;color:var(--muted);pointer-events:none}
.search input{padding-left:46px}

/* Formulários */
input,select,textarea{min-height:56px;font:inherit;font-size:18px;border:2px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
textarea{padding:12px 14px;min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--brand-text);outline:none}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-weight:700;font-size:16px}
.inrow{display:flex;gap:8px;align-items:stretch;min-width:0}
.mic{display:none;width:56px;min-height:56px;border-radius:12px;border:2px solid var(--brand);background:var(--brand-soft);color:var(--brand-text);align-items:center;justify-content:center;flex:none}
body.has-mic .mic{display:inline-flex}
.mic.on{background:var(--bad);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--bad-soft)}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.cat{min-height:88px;border-radius:16px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:15px}
.cat .ico{width:30px;height:30px}
.cat.on{background:var(--brand);border-color:var(--brand-text);color:var(--brand-ink)}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--brand-soft);border-radius:14px;padding:12px 14px}
.ctx{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--brand-text);background:var(--brand-soft);padding:6px 12px;border-radius:999px;align-self:flex-start}
.ctx .ico{width:20px;height:20px}
.total{display:flex;flex-direction:column;background:var(--surface);border-radius:14px;padding:12px 14px;border:2px solid var(--brand)}
.total span{font-weight:700;color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.05em}
.total b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.total small{color:var(--muted)}

/* Parcelas */
.parc{display:flex;flex-direction:column;gap:12px;background:var(--surface2);border-radius:16px;padding:14px;border:2px solid var(--line)}
.plist{display:flex;flex-direction:column;gap:8px}
.prow2{display:flex;gap:8px;align-items:flex-start;background:var(--surface);border-radius:14px;padding:10px;border:2px solid var(--line)}
.prow2 .pn{flex:none;width:30px;font-weight:800;color:var(--muted);padding-top:14px;text-align:center}
.pcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.pl1,.pl2{display:flex;gap:8px;min-width:0}
.prow2 [data-pk=venc]{flex:1.25 1 0;min-height:50px;font-size:16px;padding:0 8px}
.prow2 [data-pk=valor]{flex:1 1 0;min-height:50px;font-variant-numeric:tabular-nums}
.prow2 select{flex:1 1 0;min-height:50px;font-size:16px;font-weight:700}
.prow2 .del{flex:none;width:50px;height:50px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--bad)}
.prow2.paid{border-color:var(--good);background:var(--good-soft)}
.prow2.paid select{border-color:var(--good);color:var(--good)}
.prow2.late{border-color:var(--bad)}
.soma{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;font-weight:700}
.soma.ok{background:var(--good-soft);color:var(--good)}
.soma.err{background:var(--bad-soft);color:var(--bad)}
.picklist{display:flex;flex-direction:column;gap:8px}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:64px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);text-align:left}
.pick:disabled{opacity:.5}

/* Gaveta (sheet) */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;background:var(--bg);width:100%;max-width:680px;max-height:calc(100% - env(safe-area-inset-top,0px) - 8px);border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:subir .18s ease-out}
@keyframes subir{from{transform:translateY(30px);opacity:.6}}
.sheet-head{display:flex;align-items:center;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-head h2{flex:1;min-width:0}
.sheet-body{overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
.sheet-foot{display:flex;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface)}
.sheet-foot .btn.big{flex:1}
.sheet-foot .btn.danger{flex:none;min-height:64px;padding:0 18px}

/* Pagamento */
.paycard{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.pq{font-weight:700;font-size:20px}
.po{color:var(--muted)}
.pv{font-family:var(--display);font-weight:800;font-size:38px;font-variant-numeric:tabular-nums}
.paybtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.pay{min-height:84px;flex-direction:column;font-size:20px;border-radius:18px;gap:4px}
.btn.pay .ico{width:30px;height:30px}
.btn.pix{background:var(--brand);color:var(--brand-ink)}
.btn.cash{background:var(--surface);color:var(--ink);border:2px solid var(--brand)}
.btn.card{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.btn.pay.sug{outline:4px solid var(--ink);outline-offset:2px}
.done{display:flex;gap:10px;align-items:center;background:var(--good-soft);color:var(--good);font-weight:700;padding:14px;border-radius:14px}

/* Voz */
.vozbox{display:flex;flex-direction:column;align-items:center;gap:14px}
.micbig{width:120px;height:120px;border-radius:50%;border:0;background:var(--sun);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.micbig .ico{width:52px;height:52px}
.micbig.on{background:var(--bad);color:#fff;animation:pulse2 1.3s ease-in-out infinite}
@keyframes pulse2{50%{box-shadow:0 0 0 18px var(--bad-soft)}}
.vozst{font-weight:700;font-size:18px;text-align:center}

.pindots{display:flex;gap:14px;justify-content:center;margin:6px 0}
.pindots i{width:20px;height:20px;border-radius:50%;border:3px solid var(--brand-text);display:block}
.pindots i.on{background:var(--brand-text)}

.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:340px}

.key.ghost{background:transparent;box-shadow:none}
.key .ico{width:30px;height:30px}
.key:disabled{opacity:.4}
.lockerr{min-height:1.4em;color:var(--bad);font-weight:700}
.linkbtn{background:none;border:0;color:var(--brand-text);font-weight:700;min-height:48px;font-size:17px}

/* Lista de embarque */
.manifest{display:flex;flex-direction:column;gap:14px}
.manifest ol{margin:6px 0 0;padding-left:26px;display:flex;flex-direction:column;gap:6px}
.manifest li span{color:var(--muted);font-size:15px}

.tabs button{min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted);background:none;border:0;min-width:0;padding:0 2px}
.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button .ico{width:28px;height:28px}
.tabs button.on{color:var(--brand-text)}
.tabs button.on .ico{background:var(--brand-soft);border-radius:10px;width:44px;padding:2px 8px;box-sizing:content-box}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:80;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--bad);color:#fff}
.toast.live{background:var(--sun);color:var(--brand-ink)}
.back{display:flex;align-items:center;gap:12px}
.back h1{flex:1;min-width:0;overflow-wrap:anywhere}

<script type="text/plain" id="codigoScript">/**
 * Lusia Goia Turismo — cópia automática no Google Drive + assistente de voz.
 * Cole este código em script.google.com e implante como "App da Web".
 */

// 1) Esta chave precisa ser IGUAL à chave que aparece no app (Mais > Cópia na nuvem).
const CHAVE = 'TROQUE-ESTA-CHAVE';

// 2) IA GRÁTIS (recomendado) para o assistente de voz e o flyer: cole aqui a chave do Google AI Studio
//    (aistudio.google.com > Get API key > Create API key). É grátis, com limite de uso por dia.
const CHAVE_GEMINI = '';
// Modelos tentados em ordem (se o Google aposentar um, o próximo é usado).
const MODELOS_GEMINI = ['gemini-flash-latest', 'gemini-2.5-flash', 'gemini-2.0-flash'];

// 3) Opcional e PAGO: chave da API da Anthropic (console.anthropic.com). Só é usada se CHAVE_GEMINI estiver vazia.
const CHAVE_ANTHROPIC = '';

const MODELO = 'claude-opus-5-5';
const NOME_PASTA = 'Lusia Goia Turismo - Cópias de segurança';
const MANTER_COPIAS = 90; // quantos dias de cópia guardar no Drive

function doGet() {
  return resposta({ ok: true, app: 'lusia-viagens' });
}

function doPost(e) {
  let pedido;
  try { pedido = JSON.parse(e.postData.contents); } catch (err) { return resposta({ ok: false, erro: 'pedido_invalido' }); }
  if (!pedido || CHAVE === 'TROQUE-ESTA-CHAVE' || CHAVE.length < 8 || pedido.chave !== CHAVE) {
    return resposta({ ok: false, erro: 'chave_errada' });
  }
  try {
    switch (pedido.acao) {
      case 'ping': return resposta({ ok: true, ia: !!provedor(), provedor: provedor() });
      case 'backup': return resposta(salvarCopia(pedido));
      case 'restaurar': return resposta(ultimaCopia());
      case 'assistente':
        if (provedor() === 'gemini') return resposta(perguntarAoGemini(pedido.prompt, pedido.imagens));
        return resposta(perguntarAoClaude(pedido.prompt, pedido.imagens, pedido.esforco));
      default: return resposta({ ok: false, erro: 'acao_desconhecida' });
    }
  } catch (err) {
    return resposta({ ok: false, erro: 'erro_script', detalhe: String(err) });
  }
}

function resposta(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

function pasta() {
  const it = DriveApp.getFoldersByName(NOME_PASTA);
  return it.hasNext() ? it.next() : DriveApp.createFolder(NOME_PASTA);
}

function arquivosDaPasta(p) {
  const lista = [];
  const it = p.getFiles();
  while (it.hasNext()) {
    const f = it.next();
    if (/^lusia-viagens-\d{4}-\d{2}-\d{2}\.json$/.test(f.getName())) lista.push(f);
  }
  lista.sort(function (a, b) { return a.getName() < b.getName() ? 1 : -1; });
  return lista;
}

function salvarCopia(pedido) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(pedido.dia || '') || !pedido.copia) return { ok: false, erro: 'copia_invalida' };
  const p = pasta();
  const nome = 'lusia-viagens-' + pedido.dia + '.json';
  const conteudo = JSON.stringify(pedido.copia);
  const existentes = p.getFilesByName(nome);
  if (existentes.hasNext()) existentes.next().setContent(conteudo);
  else p.createFile(nome, conteudo, 'application/json');
  arquivosDaPasta(p).slice(MANTER_COPIAS).forEach(function (f) { f.setTrashed(true); });
  return { ok: true, arquivo: nome };
}

function ultimaCopia() {
  const fs = arquivosDaPasta(pasta());
  if (!fs.length) return { ok: false, erro: 'sem_copia' };
  return { ok: true, arquivo: fs[0].getName(), copia: JSON.parse(fs[0].getBlob().getDataAsString('UTF-8')) };
}

function chaveIA() {
  return PropertiesService.getScriptProperties().getProperty('ANTHROPIC_API_KEY') || CHAVE_ANTHROPIC;
}

function chaveGemini() {
  return PropertiesService.getScriptProperties().getProperty('GEMINI_API_KEY') || CHAVE_GEMINI;
}

function provedor() {
  if (chaveGemini()) return 'gemini';
  if (chaveIA()) return 'claude';
  return '';
}

// IA grátis do Google (Gemini). Fotos vão junto do texto.
function perguntarAoGemini(prompt, imagens) {
  const chave = chaveGemini();
  if (!chave) return { ok: false, erro: 'sem_ia' };
  const partes = [];
  (Array.isArray(imagens) ? imagens : []).slice(0, 5).forEach(function (b64) {
    if (typeof b64 === 'string' && b64.length > 100) partes.push({ inline_data: { mime_type: 'image/jpeg', data: b64 } });
  });
  partes.push({ text: String(prompt || '') });
  let ultimo = { ok: false, erro: 'ia_404' };
  for (let i = 0; i < MODELOS_GEMINI.length; i++) {
    const modelo = MODELOS_GEMINI[i];
    const r = UrlFetchApp.fetch('https://generativelanguage.googleapis.com/v1beta/models/' + modelo + ':generateContent', {
      method: 'post',
      contentType: 'application/json',
      muteHttpExceptions: true,
      headers: { 'x-goog-api-key': chave },
      payload: JSON.stringify({
        contents: [{ role: 'user', parts: partes }],
        generationConfig: { responseMimeType: 'application/json', temperature: 0.6 }
      })
    });
    const codigo = r.getResponseCode();
    let j = {};
    try { j = JSON.parse(r.getContentText()); } catch (e) {}
    if (codigo === 404) { ultimo = { ok: false, erro: 'ia_404', detalhe: modelo }; continue; }
    if (codigo !== 200) return { ok: false, erro: 'ia_' + codigo, detalhe: j.error && j.error.message };
    const c = (j.candidates || [])[0];
    if (!c || !c.content || !c.content.parts) return { ok: false, erro: 'ia_recusou' };
    const texto = c.content.parts.map(function (p) { return p.text || ''; }).join('');
    return { ok: true, texto: texto, modelo: modelo };
  }
  return ultimo;
}

function perguntarAoClaude(prompt, imagens, esforco) {
  const chave = chaveIA();
  if (!chave) return { ok: false, erro: 'sem_ia' };
  // Fotos (do flyer) vão antes do texto; cada uma é um JPEG em base64.
  const conteudo = [];
  (Array.isArray(imagens) ? imagens : []).slice(0, 5).forEach(function (b64) {
    if (typeof b64 === 'string' && b64.length > 100) {
      conteudo.push({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } });
    }
  });
  conteudo.push({ type: 'text', text: String(prompt || '') });
  const nivel = ['low', 'medium', 'high'].indexOf(esforco) >= 0 ? esforco : 'low';
  const r = UrlFetchApp.fetch('https://api.anthropic.com/v1/messages', {
    method: 'post',
    contentType: 'application/json',
    muteHttpExceptions: true,
    headers: {
      'x-api-key': chave,
      'anthropic-version': '2026-10-21',
      'anthropic-beta': 'server-side-fallback-2026-07-01'
    },
    payload: JSON.stringify({
      model: MODELO,
      max_tokens: 16000,
      output_config: { effort: nivel },
      fallbacks: 'default',
      messages: [{ role: 'user', content: conteudo }]
    })
  });
  const codigo = r.getResponseCode();
  let j = {};
  try { j = JSON.parse(r.getContentText()); } catch (e) {}
  if (codigo !== 200) return { ok: false, erro: 'ia_' + codigo, detalhe: j.error && j.error.message };
  if (j.stop_reason === 'refusal') return { ok: false, erro: 'ia_recusou' };
  const texto = (j.content || []).filter(function (b) { return b.type === 'text'; }).map(function (b) { return b.text; }).join('');
  return { ok: true, texto: texto };
}
</script>

async function compartilharImagem(canvas, nome, texto) {
  const blob = await new Promise(ok => canvas.toBlob(ok, 'image/png'));
  const f = new File([blob], nome, {type: 'image/png'});
  try {
    if (navigator.canShare && navigator.canShare({files: [f]})) {
      if (texto) { try { await navigator.clipboard.writeText(texto); } catch (e) {} }
      await navigator.share({files: [f], text: texto || ''});
      if (texto) toast('Se a mensagem não aparecer junto, cole: ela já está copiada.');
      return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(f); const a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  if (texto) window.open(waLink('', texto), '_blank', 'noopener');
  toast('Imagem salva. Anexe no WhatsApp que abriu.');
}
function salvarContato(nome, tel) {
  const v = ['BEGIN:VCARD', 'VERSION:3.0', `FN:${nome}`, `N:;${nome};;;`, `TEL;TYPE=CELL:+${waNum(tel)}`, 'NOTE:Cliente Lusia Goia Turismo', 'END:VCARD'].join('\r\n');
  const f = new File([v], `${norm(nome).replace(/[^a-z0-9]+/g, '-') || 'contato'}.vcf`, {type: 'text/vcard'});
  const url = URL.createObjectURL(f); const a = document.createElement('a'); a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('Abra o arquivo baixado para salvar nos contatos');
}

const micBtn = id => `<button type="button" class="mic" data-act="mic" data-mic-for="${id}" aria-label="Falar para preencher">${ic('mic')}</button>`;
function field(f, label, kind, value, ph, o) {
  o = o || {};
  const id = 'f_' + f.replace(/\./g, '_');
  const im = {cpf: 'numeric', tel: 'tel', money: 'decimal', int: 'numeric'}[kind];
  const type = kind === 'date' ? 'date' : kind === 'time' ? 'time' : 'text';
  const semMic = o.nomic || kind === 'time' || kind === 'plain';
  return `<label class="fld" for="${id}"><span class="lbl">${label}</span><span class="inrow"><input id="${id}" type="${type}" data-f="${f}" data-kind="${kind}" ${im ? `inputmode="${im}"` : ''} ${o.recalc ? 'data-recalc="1"' : ''} ${o.min ? `min="${o.min}"` : ''} value="${esc(value ?? '')}" placeholder="${esc(ph || '')}" autocomplete="off" ${kind === 'plain' ? 'spellcheck="false" autocapitalize="off"' : ''}>${semMic ? '' : micBtn(id)}</span>${o.after || ''}</label>`;
}
function setPath(o, p, v) { const ks = p.split('.'); let t = o; for (let i = 0; i < ks.length - 1; i++) { t[ks[i]] = t[ks[i]] || {}; t = t[ks[i]]; } t[ks[ks.length - 1]] = v; }
function openSheet(kind, data, push) {
  pararMic();
  if (F && push) stack.push(F); else stack.length = 0;
  F = {kind, ...data};
  renderSheet(true);
}
function closeSheet() {
  pararMic(); pararVoz();
  if (stack.length) { F = stack.pop(); renderSheet(true); }
  else { F = null; const el = $('#sheet'); el.hidden = true; el.innerHTML = ''; document.body.classList.remove('lock'); agendar(); }
}
function renderSheet(top) {
  const el = $('#sheet'); const old = el.querySelector('.sheet-body'); const sc = old ? old.scrollTop : 0;
  const h = SHEETS[F.kind]();
  keepFocus(() => {
    el.innerHTML = `<div class="scrim"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(h.title)}"><header class="sheet-head"><button class="iconbtn" data-act="fechar" aria-label="Voltar">${ic('back')}</button><h2>${esc(h.title)}</h2></header><div class="sheet-body">${h.body}</div>${h.foot ? `<footer class="sheet-foot">${h.foot}</footer>` : ''}</section>`;
  });
  el.hidden = false; document.body.classList.add('lock');
  if (F.kind === 'compartilhar') { const s = $('#bvSlot'); const vi = viagemDe(F.viagemId); if (s && vi) { const c = desenharBoasVindas(vi); c.style.cssText = 'width:100%;max-width:420px;height:auto;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.15)'; s.appendChild(c); } }
  const nb = el.querySelector('.sheet-body'); if (nb) nb.scrollTop = top ? 0 : sc;
  marcarMic(); marcarVoz();
}

function embarqueChips(cur, comHorario) {
  const embs = S.embarques.slice().sort(byNome('nome'));
  const temAtual = !cur || embs.some(e => norm(e.nome) === norm(cur));
  const chips = embs.map(e => `<button class="chip ${norm(cur) === norm(e.nome) ? 'on' : ''} ${comHorario && e.horario ? 'tall' : ''}" data-act="set" data-f="embarque" data-v="${esc(e.nome)}">${esc(e.nome)}${comHorario && e.horario ? `<small>saída ${esc(e.horario.replace(':', 'h'))}</small>` : ''}</button>`).join('');
  return `<div class="chips">${chips}${temAtual ? '' : `<button class="chip on" data-act="set" data-f="embarque" data-v="${esc(cur)}">${esc(cur)}</button>`}<button class="chip add" data-act="novoEmbarqueForm">${ic('plus')} Novo ponto</button></div>`;
}

function formTotal() { return F.kind === 'venda' ? r2(num(F.valor)) : totalCusto(F); }
function totalCusto(f) { const q = num(f.qtd), u = num(f.unit); const n = (f.categoria === 'hotel' || f.categoria === 'alimentacao') ? (num(f.vezes) || 1) : 1; return r2(q * u * n); }

/* ----- Parcelas: cada uma com data, valor e forma ----- */
function parcBox() {
  const p = F.parc; const total = formTotal(); const vi = viagemDe(F.viagemId);
  const limite = F.kind === 'venda' && vi ? vi.ida : null;
  const pagas = p.lista.filter(x => x.pago);
  const restante = r2(total - soma(pagas.map(x => x.valor)));
  const minN = Math.max(1, pagas.length + (restante > 0.004 ? 1 : 0));

  if (total <= 0) return `<div class="parc"><span class="lbl">Parcelas</span><p class="hint">Informe o valor para montar as parcelas.</p></div>`;
  const chips = Array.from({length: 12}, (_, i) => i + 1).map(n => `<button class="chip n ${p.n === n ? 'on' : ''}" data-act="setN" data-v="${n}" ${n < minN || (n > maxN && n !== p.n) ? 'disabled' : ''}>${n}x</button>`).join('');
  return `<div class="parc">
    <span class="lbl">Em quantas vezes?</span>
    <div class="chips">${chips}</div>
    <div class="fld"><span class="lbl">De quanto em quanto tempo?</span><div class="chips">${Object.keys(INTERVALOS).map(k => `<button class="chip ${p.intervalo === k ? 'on' : ''}" data-act="setIntervalo" data-v="${k}">${INTERVALOS[k]}</button>`).join('')}</div></div>
    ${field('parc.primeiro', pagas.length ? 'Próximo vencimento' : '1º vencimento', 'date', p.primeiro, '', {recalc: true})}
    ${limite ? `<p class="hint">Tudo precisa estar pago antes da viagem (${fmtDL(limite)}).</p>` : ''}
    <span class="lbl">Parcelas</span>
    <p class="hint" style="margin-top:-8px">Pode mudar a data e o valor de cada uma. Quando a pessoa pagar, escolha como pagou.</p>
    <div class="plist" id="plist">${linhasParc()}</div>
    <button class="btn sec" data-act="addParc">${ic('plus')} Adicionar parcela</button>
    <div id="parcSoma">${somaHtml()}</div>
  </div>`;
}
function linhasParc() {
  const h = hoje(); const vi = viagemDe(F.viagemId); const limite = F.kind === 'venda' && vi ? vi.ida : null;
  const L = F.parc.lista;
  return L.map((x, i) => {
    const late = !x.pago && x.venc < h; const depois = limite && !x.pago && x.venc >= limite;
    const opts = `<option value="">A pagar${late ? ' (atrasada)' : ''}</option>` + Object.keys(FORMA).map(k => `<option value="${k}" ${x.pago && x.forma === k ? 'selected' : ''}>${FORMA_LONGA[k]}</option>`).join('');
    return `<div class="prow2 ${x.pago ? 'paid' : ''} ${late || depois ? 'late' : ''}">
      <span class="pn">${i + 1}ª</span>
      <div class="pcol">
        <div class="pl1"><input type="date" data-pv="${i}" data-pk="venc" value="${esc(x.venc)}" aria-label="Data da parcela ${i + 1}">
        <input type="text" inputmode="decimal" data-pv="${i}" data-pk="valor" value="${fmtNum(x.valor)}" aria-label="Valor da parcela ${i + 1}" autocomplete="off"></div>
        <div class="pl2"><select data-pv="${i}" data-pk="forma" aria-label="Situação da parcela ${i + 1}">${opts}</select>
        ${L.length > 1 && !x.pago ? `<button class="del" data-act="delParc" data-i="${i}" aria-label="Tirar parcela ${i + 1}">${ic('x')}</button>` : ''}</div>
      </div>

}
function somaHtml() {
  const total = formTotal(); const s = soma(F.parc.lista.map(x => x.valor)); const d = r2(total - s);
  const pago = pagoDe(F.parc.lista);
  if (Math.abs(d) < 0.01) return `<div class="soma ok"><span>${ic('check')} As parcelas fecham ${money(total)}</span><span>Pago: ${money(pago)}</span></div>`;
  return `<div class="soma err"><span>${d > 0 ? `Faltam ${money(d)} para fechar ${money(total)}` : `As parcelas passam ${money(-d)} de ${money(total)}`}</span><button class="btn sm sec" data-act="ajustarUltima">Ajustar última</button></div>`;
}
function atualizarParc(tudo) {
  if (tudo) { const pb = $('#parcBox'); if (pb) keepFocus(() => { pb.innerHTML = parcBox(); }); }
  else { const s = $('#parcSoma'); if (s) s.innerHTML = somaHtml(); }

function registrarPagamento(forma) {
  const doc = getDoc(F.col, F.docId); if (!doc) return;
  const ps = (doc.parcelas || []).map(p => ({...p})); const p = ps[F.idx];
  if (!p || p.pago) return;
  const valor = r2(num(F.valor)); if (!(valor > 0)) return toast('Informe o valor', 'bad');
  const data = isoOk(F.data) || hoje();
  if (valor < p.valor - 0.004) { ps.splice(F.idx + 1, 0, {venc: p.venc, valor: r2(p.valor - valor), pago: false}); p.valor = valor; }
  else if (valor > p.valor + 0.004) {
    let extra = r2(valor - p.valor); p.valor = valor;
    for (let i = ps.length - 1; i >= 0 && extra > 0.004; i--) { if (i === F.idx || ps[i].pago) continue; const tira = Math.min(extra, ps[i].valor); ps[i].valor = r2(ps[i].valor - tira); extra = r2(extra - tira); }
    for (let i = ps.length - 1; i >= 0; i--) if (!ps[i].pago && ps[i].valor <= 0.004) ps.splice(i, 1);
  }
  Object.assign(p, {pago: true, forma, dataPago: data});
  const isR = F.col === 'vendas';
  if (gravar(() => setDoc(F.col, F.docId, {...doc, parcelas: ps}), `${isR ? 'Recebido' : 'Pago'} ${money(valor)} no ${FORMA[forma]}`)) closeSheet();
}
function desfazerPagamento() {
  const doc = getDoc(F.col, F.docId); if (!doc) return;
  const ps = (doc.parcelas || []).map(p => ({...p})); const p = ps[F.idx]; if (!p) return;
  p.pago = false; delete p.forma; delete p.dataPago;
  if (gravar(() => setDoc(F.col, F.docId, {...doc, parcelas: ps}), 'Pagamento desfeito')) closeSheet();
}

async function chamarNuvem(acao, extra, ms, conf) {
  const c = conf || META.nuvem || {};
  if (!c.url || !c.chave) throw {code: 'sem_config'};
  if (!navigator.onLine) throw {code: 'offline'};
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms || 30000);
  try {
    const r = await fetch(c.url, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({chave: c.chave, acao, ...(extra || {})}), signal: ctl.signal});
    const txt = await r.text();
    try { return JSON.parse(txt); } catch (e) { throw {code: 'resposta'}; }
  } catch (e) {
    if (e && e.name === 'AbortError') throw {code: 'tempo'};
    if (e && e.code) throw e;
    throw {code: 'rede'};
  } finally { clearTimeout(t); }
}
async function pingNuvem() {
  if (!META.nuvem || !navigator.onLine) { IA.ok = false; agendar(); return; }
  try { const j = await chamarNuvem('ping', {}, 20000); IA.ok = !!(j.ok && j.ia); IA.provedor = j.provedor || ''; if (!j.ok) { META.nuvemErro = traduzErro(j.erro); persistir(); } }

}
let enviando = false;
async function autoBackup(forcar) {
  const c = META.nuvem;

  if (!precisa) return null;

  try {
    const j = await chamarNuvem('backup', {dia: h, copia: pacote()}, 60000);
    if (j.ok) { META.nuvemDia = h; META.nuvemEm = Date.now(); META.nuvemErro = ''; }

}

}

/* ---------- microfone dos campos ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, ouvindo = false, micTarget = null;
if (SR) document.body.classList.add('has-mic');
function marcarMic() { document.querySelectorAll('[data-mic-for]').forEach(b => b.classList.toggle('on', ouvindo && b.dataset.micFor === micTarget)); }
function pararMic() { if (rec && ouvindo) { try { rec.abort(); } catch (e) {} } ouvindo = false; }
function micErro(c) {
  if (c === 'not-allowed' || c === 'service-not-allowed') toast('Microfone bloqueado. Libere o microfone para este app nas configurações.', 'bad');
  else if (c === 'network') toast('Sem internet, o microfone do app não funcionou. Use o microfone do teclado.', 'bad');
  else if (c === 'no-speech') toast('Não ouvi nada. Toque no microfone e fale de novo.', 'bad');
  else if (c === 'language-not-supported') toast('O celular não reconhece português offline. Use o microfone do teclado.', 'bad');
  else if (c !== 'aborted') toast('O microfone falhou. Tente de novo.', 'bad');
}
function ligarMic(id) {
  if (!SR) return;
  pararVoz();
  if (ouvindo) { const mesmo = micTarget === id; pararMic(); marcarMic(); if (mesmo) return; }
  micTarget = id;
  rec = new SR();
  rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  if (!navigator.onLine && 'processLocally' in rec) { try { rec.processLocally = true; } catch (e) {} }
  rec.onstart = () => { ouvindo = true; marcarMic(); toast('Pode falar…', 'live'); };
  rec.onresult = ev => {
    let fin = '', par = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) { const r = ev.results[i]; if (r.isFinal) fin += r[0].transcript; else par += r[0].transcript; }
    if (par) toast('“' + par + '”', 'live');
    if (fin) { const el = document.getElementById(micTarget); if (el) aplicarDitado(el, fin); }
  };
  rec.onerror = ev => micErro(ev.error);
  rec.onend = () => { ouvindo = false; marcarMic(); const t = $('#toast'); if (t.classList.contains('live')) t.hidden = true; };
  try { rec.start(); } catch (e) { toast('Não deu para ligar o microfone.', 'bad'); }
  marcarMic();
}
function aplicarDitado(el, text) {
  const k = el.dataset.kind; let v;
  if (k === 'cpf') v = fmtCPF(text);
  else if (k === 'tel') v = fmtTel(text);
  else if (k === 'money') { const n = parseValor(text); if (n == null) return toast('Não entendi o valor. Fale só o número.', 'bad'); v = fmtNum(n); }
  else if (k === 'int') { const n = parseValor(text); if (n == null) return toast('Não entendi o número.', 'bad'); v = String(Math.round(n)); }
  else if (k === 'date') { const d = parseData(text); if (!d) return toast('Não entendi a data. Ex.: “15 de março”', 'bad'); v = d; }
  else if (k === 'busca') v = text.trim().replace(/[.!?]$/, '');
  else { const t = text.trim().replace(/[.!?]$/, ''); v = el.value.trim() ? el.value.trim() + ' ' + t : t; v = v.charAt(0).toUpperCase() + v.slice(1); }
  el.value = v;
  el.dispatchEvent(new Event('input', {bubbles: true}));
  el.dispatchEvent(new Event('change', {bubbles: true}));
}

    let vs = S.vendas.filter(v => v.clienteId === c.id && (v.parcelas || []).some(p => !p.pago));
    if (vi && vs.some(v => v.viagemId === vi.id)) vs = vs.filter(v => v.viagemId === vi.id);

    for (let i = L.length - 1; i >= 0; i--) { if (!L[i].pago) { const v = r2(L[i].valor + dif); if (v <= 0) return toast('Não dá para ajustar só a última. Use os botões de vezes.', 'bad'); L[i].valor = v; atualizarParc(true); return; } }
    toast('Todas as parcelas já estão pagas.', 'bad');
  },
  cat(d) { escolherCat(d.v); },
  pagar(d) { abrirPagar(d.col, d.id, Number(d.i)); },
  confirmarPag(d) { registrarPagamento(d.forma); },
  desfazerPag() { desfazerPagamento(); },
  salvar() { SALVAR[F.kind](); },
  excluir() { excluir(); },
  fechar() { closeSheet(); },
  mic(d) { ligarMic(d.micFor); },
  voz() { openSheet('voz', {texto: '', msg: ''}); if (SR) ligarVoz(); },
  vozMic() { if (vozOuvindo) pararVoz(); else ligarVoz(); },
  vozEntender() { pararVoz(() => interpretar()); },
  apagarExemplos() {
    if (!UI.confEx) { UI.confEx = true; render(); return; }
    UI.confEx = false;
    gravar(() => { COLS.forEach(c => { S[c] = S[c].filter(x => !x.exemplo); }); }, 'Exemplos apagados');
  },
  backup() { baixarBackup(); },
  enviarBackup() { enviarBackup(); },
  restaurar() { const i = $('#arqBackup'); i.value = ''; i.click(); },
  cancelarRestaurar() { UI.restaurar = null; render(); },
  confirmarRestaurar() {
    const j = UI.restaurar; if (!j) return;
    const ok = gravar(() => { COLS.forEach(c => { S[c] = Array.isArray(j.dados[c]) ? j.dados[c] : []; }); migrarEmbarques(); META.iniciado = true; }, 'Dados restaurados');
    if (ok) { UI.restaurar = null; UI.viagemId = null; UI.tab = 'inicio'; render(); window.scrollTo(0, 0); }
  },
  configNuvem() { const c = META.nuvem || {}; openSheet('nuvem', {url: c.url || '', chave: c.chave || ('lusia-' + randHex(8)), msg: ''}); },
  copiarCodigo() { const ch = str(F.chave); if (ch.length < 8) return toast('A chave precisa ter pelo menos 8 caracteres', 'bad'); copiar(codigoScript(ch), 'Código copiado. Cole no script.google.com'); },
  testarNuvem() { testarNuvem(); },
  removerNuvem() { if (!F._del) { F._del = true; renderSheet(); return; } META.nuvem = null; META.nuvemErro = ''; IA.ok = false; persistir(); closeSheet(); toast('Cópia na nuvem desligada'); },
  async backupAgora() { toast('Enviando cópia…'); const ok = await autoBackup(true); toast(ok ? 'Cópia salva no Google Drive' : 'Não deu: ' + (META.nuvemErro || 'sem internet agora.'), ok ? '' : 'bad'); },
  restaurarNuvem() { restaurarNuvem(); },
  verVendaCli(d) { editVenda(d.id, true); },
  compartilharViagem() { openSheet('compartilhar', {viagemId: UI.viagemId}); },
  capaBV() { const i = $('#arqCapa'); i.value = ''; i.click(); },
  enviarBV() { const vi = viagemDe(F.viagemId); compartilharImagem(desenharBoasVindas(vi), `boas-vindas-${norm(vi.destino).replace(/[^a-z0-9]+/g, '-')}.png`, textoBoasVindas(vi)); },
  async baixarBV() { const vi = viagemDe(F.viagemId); const c = desenharBoasVindas(vi); const b = await new Promise(ok => c.toBlob(ok, 'image/png')); const url = URL.createObjectURL(b); const a = document.createElement('a'); a.href = url; a.download = `boas-vindas-${norm(vi.destino).replace(/[^a-z0-9]+/g, '-')}.png`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); toast('Cartão salvo na pasta Downloads'); },
  editCliPush(d) { const c = clienteDe(d.id); if (c) openSheet('cliente', {id: c.id, nome: c.nome || '', cpf: c.cpf || '', tel: c.tel || '', embarque: c.embarque || ''}, true); },
  salvarContato() { if (digits(F.tel).length < 10) return toast('Digite o celular completo, com DDD', 'bad'); salvarContato(str(F.nome) || 'Cliente', F.tel); },
  flyWhats() { compartilharImagem(FLY.canvas, `flyer-${norm(viagemDe(FLY.viagemId).destino).replace(/[^a-z0-9]+/g, '-')}.png`, FLY.resultado.legenda || ''); },
  addFotos() { const i = $('#arqFotos'); i.value = ''; i.click(); },
  delFoto(d) { const f = FLY.fotos.splice(Number(d.i), 1)[0]; if (f) URL.revokeObjectURL(f.url); if (FLY.resultado) desenharFlyer(); render(); },
  flyFormato(d) { FLY.formato = d.v; if (FLY.resultado) desenharFlyer(); render(); },
  flyEstilo(d) { FLY.estilo = d.v; if (FLY.resultado && d.v !== 'auto') { FLY.estiloForcado = d.v; desenharFlyer(); } render(); },
  flyTrocar(d) { FLY.estiloForcado = d.v; desenharFlyer(); render(); },
  gerarFlyer() { gerarFlyer(); },
  async flyCompartilhar() {
    const f = await flyerArquivo();
    try {
      if (navigator.canShare && navigator.canShare({files: [f]})) {
        if (FLY.resultado.legenda) { try { await navigator.clipboard.writeText(FLY.resultado.legenda); toast('Legenda copiada. Cole junto com a foto.'); } catch (e) {} }
        await navigator.share({files: [f], text: FLY.resultado.legenda || ''});
      } else ACT.flyBaixar();
    } catch (e) { if (e && e.name !== 'AbortError') ACT.flyBaixar(); }
  },
  async flyBaixar() {
    const f = await flyerArquivo(); const url = URL.createObjectURL(f);
    const a = document.createElement('a'); a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast('Flyer salvo na pasta Downloads');
  },
  flyLegenda() { copiar(FLY.resultado.legenda, 'Legenda copiada'); }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(b.dataset, b, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.busca === 'clientes' || el.dataset.busca === 'fornecedores') {
    UI.busca[el.dataset.busca] = el.value;
    const l = $('#lista'); if (l) l.innerHTML = el.dataset.busca === 'clientes' ? listaClientes() : listaFornecedores();
    return;
  }
  if (el.id === 'flyDesc') { FLY.desc = el.value; return; }
  if (el.id === 'flyZap') { META.contato = el.value; return; }
  if (!F || !el.closest('#sheet')) return;
  if (el.dataset.busca === 'venda') { F.busca = el.value; const l = $('#cliPick'); if (l) l.innerHTML = pickList(); return; }
  if (el.dataset.pv != null) {
    const x = F.parc.lista[Number(el.dataset.pv)]; if (!x) return;
    if (el.dataset.pk === 'venc') { x.venc = el.value; if (x.pago) x.dataPago = el.value; }
    if (el.dataset.pk === 'valor') { x.valor = r2(num(el.value)); atualizarParc(false); }
    return;
  }
  if (el.dataset.f) { setPath(F, el.dataset.f, el.value); if (el.dataset.recalc) recalc(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'arqBackup') { if (el.files && el.files[0]) lerBackup(el.files[0]); return; }
  if (el.id === 'arqFotos') { if (el.files && el.files.length) addFotos(el.files); return; }
  if (el.id === 'arqCapa') {
    const file = el.files && el.files[0]; if (!file) return;
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { if (BV.fotoUrl) URL.revokeObjectURL(BV.fotoUrl); BV.foto = img; BV.fotoUrl = url; if (F && F.kind === 'compartilhar') renderSheet(); };
    img.onerror = () => toast('Essa foto não abriu.', 'bad');
    img.src = url; return;
  }
  if (el.id === 'flyViagem') { FLY.viagemId = el.value; FLY.resultado = null; FLY.erro = ''; render(); return; }
  if (el.id === 'flyZap') { el.value = fmtTel(el.value); META.contato = el.value; persistir(); if (FLY.resultado) { desenharFlyer(); render(); } return; }
  if (!F || !el.closest('#sheet')) return;
  if (el.dataset.pv != null) {
    const x = F.parc.lista[Number(el.dataset.pv)]; if (!x) return;
    if (el.dataset.pk === 'forma') {
      if (el.value) { const h = hoje(); if (x.venc > h) x.venc = h; Object.assign(x, {pago: true, forma: el.value, dataPago: x.venc}); }
      else { x.pago = false; delete x.forma; delete x.dataPago; }
      atualizarParc(true);
    } else if (el.dataset.pk === 'valor') { el.value = fmtNum(x.valor); }
    else if (el.dataset.pk === 'venc') { atualizarParc(true); }
    return;
  }
  if (!el.dataset.f) return;
  const k = el.dataset.kind;
  if (k === 'cpf') { el.value = fmtCPF(el.value); setPath(F, el.dataset.f, el.value); const a = $('#cpfAviso'); if (a) a.innerHTML = (!el.value || digits(el.value).length < 11 || cpfValido(el.value)) ? '' : '<div class="aviso">Este CPF parece errado. Confira os números.</div>'; }
  if (k === 'tel') { el.value = fmtTel(el.value); setPath(F, el.dataset.f, el.value); if (F.kind === 'cliente') renderSheet(); }
  if (k === 'money' && el.value) { const n = parseValor(el.value); if (n != null) { el.value = fmtNum(n); setPath(F, el.dataset.f, el.value); } }
  if (el.tagName === 'SELECT') setPath(F, el.dataset.f, el.value);
  if (F.kind === 'viagem' && (el.dataset.f === 'ida' || el.dataset.f === 'volta')) {
    if (F.volta && F.ida && F.volta < F.ida) { F.volta = ''; toast('A volta não pode ser antes da ida', 'bad'); }
    renderSheet();
  }
});
document.addEventListener('keydown', e => {
  if (!META.iniciado || !(LOCK.ativo || !META.pin)) return;
  if (!['entrar', 'criar', 'confirmar', 'trocar'].includes(LOCK.modo)) return;
  if (/^\d$/.test(e.key)) { e.preventDefault(); tecla(e.key); }
  else if (e.key === 'Backspace') { e.preventDefault(); tecla('apagar'); }
});
window.addEventListener('popstate', () => { if (F) { closeSheet(); try { history.pushState(null, ''); } catch (e) {} } });
let escondidoEm = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { escondidoEm = Date.now(); return; }
  if (META.pin && !LOCK.ativo && escondidoEm && Date.now() - escondidoEm > 60000) bloquear();
  else if (!LOCK.ativo) autoBackup();
});
window.addEventListener('online', () => { pingNuvem().then(() => autoBackup()); });
window.addEventListener('offline', () => { IA.ok = false; agendar(); });
setInterval(() => autoBackup(), 5 * 60000);

let tt = 0;
function toast(msg, tipo) { const el = $('#toast'); el.textContent = msg; el.className = 'toast ' + (tipo || ''); el.hidden = false; el.setAttribute('role', 'status'); clearTimeout(tt); tt = setTimeout(() => { el.hidden = true; }, tipo === 'live' ? 8000 : 3200); }

/* ---------- início ---------- */
carregar();
if (!META.iniciado && COLS.some(c => S[c].length)) META.iniciado = true;
migrarEmbarques();
LOCK.ativo = !!META.pin; LOCK.modo = META.pin ? 'entrar' : 'criar';
render();
verificarDigital().then(() => { render(); if (LOCK.ativo && META.credId && temDigital) entrarDigital(); });
try { history.pushState(null, ''); } catch (e) {}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
