<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lusia Viagens</title>
<meta name="description" content="Viagens, clientes, fornecedores, recebimentos e pagamentos da Lusia.">
<meta name="theme-color" content="#0C6B63">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lusia Viagens">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: app de uma coluna (máx. 760px), barra de abas fixa embaixo, formulários em "gaveta" que sobe da base. Viagens desenhadas como passagem com canhoto da data. Sem nada externo: funciona offline. */
:root{
  --bg:#EEF3F4; --surface:#FFFFFF; --surface2:#F6F9F9; --ink:#0F2430; --muted:#526773; --line:#D3DEE1;
  --brand:#0C6B63; --brand-ink:#FFFFFF; --brand-soft:#D7ECE9;
  --sun:#F2B33D; --sun-soft:#FCEFD2; --sun-ink:#3B2A00;
  --good:#1D7F49; --good-soft:#DDF1E5; --bad:#B93C12; --bad-soft:#FBE3D9; --warn:#946200; --warn-soft:#FBF0D3;
  --scrim:rgba(8,24,30,.45); --shadow:0 1px 2px rgba(15,36,48,.06),0 6px 18px rgba(15,36,48,.07);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  --display:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B171C; --surface:#13232A; --surface2:#182B33; --ink:#E5EEF0; --muted:#94A9B1; --line:#27404A;
  --brand:#3CB7AA; --brand-ink:#04231F; --brand-soft:#173A38;
  --sun:#F2B33D; --sun-soft:#3A2F15; --sun-ink:#FCEFD2;
  --good:#5BCB8B; --good-soft:#163527; --bad:#F08B66; --bad-soft:#3D2018; --warn:#E9BE5A; --warn-soft:#352B12;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B171C; --surface:#13232A; --surface2:#182B33; --ink:#E5EEF0; --muted:#94A9B1; --line:#27404A;
  --brand:#3CB7AA; --brand-ink:#04231F; --brand-soft:#173A38;
  --sun:#F2B33D; --sun-soft:#3A2F15; --sun-ink:#FCEFD2;
  --good:#5BCB8B; --good-soft:#163527; --bad:#F08B66; --bad-soft:#3D2018; --warn:#E9BE5A; --warn-soft:#352B12;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.ico{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.t-good{color:var(--good)} .t-bad{color:var(--bad)} .t-muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.brand{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1}
.brand span{color:var(--brand)}
.sub{color:var(--muted);font-size:15px;margin-top:4px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800}
h2{font-size:21px;font-weight:800}
h3{font-size:18px;font-weight:700}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.count{background:var(--brand-soft);color:var(--brand);font-weight:700;border-radius:999px;padding:2px 12px;font-size:15px}

/* Botões */
.btn{min-height:56px;border-radius:14px;border:0;font-weight:700;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 20px;text-decoration:none;transition:transform .08s;text-align:center}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn.sec{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.big{width:100%;min-height:64px;font-size:20px}
.btn.sm{min-height:44px;font-size:16px;padding:0 14px;border-radius:12px}
.btn.sq{width:56px;padding:0;flex:none}
.iconbtn{width:52px;height:52px;border-radius:14px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none;border:2px solid var(--line)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow>.btn{flex:1 1 160px}

/* Avisos */
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--warn-soft);color:var(--ink);font-size:16px}
.banner .ico{color:var(--warn)}
.banner p{margin:0;flex:1 1 200px}
.banner.info{background:var(--brand-soft)} .banner.info .ico{color:var(--brand)}
.aviso{padding:10px 14px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-weight:700;font-size:16px}
.hint{color:var(--muted);font-size:15px;margin:0}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:18px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{margin:0;color:var(--muted)}
.welcome{background:var(--surface);border-radius:22px;padding:26px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.welcome p{margin:0;color:var(--muted)}

/* Indicadores */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.tile{background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .tl{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--muted);font-size:15px;text-transform:uppercase;letter-spacing:.05em}
.tile .tv{font-family:var(--display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;line-height:1.15}
.tile small{color:var(--muted);font-size:15px}
.tile.rec .tl .ico{color:var(--good)} .tile.pag .tl .ico{color:var(--bad)} .tile.luc .tl .ico{color:var(--brand)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:var(--shadow)}
.kpi span{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi b{font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi small{color:var(--muted);font-size:14px}
.kpi.lucro{background:var(--brand);color:var(--brand-ink)} .kpi.lucro span,.kpi.lucro small{color:var(--brand-ink);opacity:.85}
.kpi.lucro.neg{background:var(--bad);color:#fff} .kpi.lucro.neg span,.kpi.lucro.neg small{color:#fff}

.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;flex:1;min-width:40px}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--good)}
.bar i.brand{background:var(--brand)}
.bar.big{height:16px;border-radius:9px}
.prog{background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.pl{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.pl span{font-weight:700}
.pl b{font-variant-numeric:tabular-nums}
.pl small{color:var(--muted);font-weight:400}

/* Passagem (cartão de viagem) */
.ticket{display:grid;grid-template-columns:86px 1fr;background:var(--surface);border-radius:18px;position:relative;overflow:hidden;box-shadow:var(--shadow);border:0;padding:0;text-align:left;width:100%}
.ticket::before,.ticket::after{content:"";position:absolute;left:77px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.ticket::before{top:-9px} .ticket::after{bottom:-9px}
.stub{background:var(--brand);color:var(--brand-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 4px;border-right:2px dashed var(--surface);gap:2px}
.stub .d{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.stub .m{text-transform:uppercase;letter-spacing:.12em;font-size:14px;font-weight:700}
.stub .y{font-size:13px;opacity:.8}
.stub.passada{background:var(--muted)}
.tbody{padding:12px 14px 14px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tdest{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15;overflow-wrap:anywhere}
.tmeta{color:var(--muted);font-size:15px}
.tstats{display:flex;gap:14px;flex-wrap:wrap;font-weight:700;font-size:16px;align-items:center}
.tstats span{display:inline-flex;gap:6px;align-items:center}
.tstats .ico{width:20px;height:20px}
.mini{display:grid;grid-template-columns:76px 1fr 42px;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.mini span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.list{display:flex;flex-direction:column;gap:10px}

/* Vencimentos */
.venc{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
.vdate{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface2);border-radius:12px;min-height:56px;border:2px solid var(--line)}
.vdate b{font-family:var(--display);font-size:22px;line-height:1}
.vdate span{text-transform:uppercase;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.venc.late .vdate{border-color:var(--bad);background:var(--bad-soft)}
.venc.late .vdate span{color:var(--bad)}
.vinfo{min-width:0}
.vq{font-weight:700;overflow-wrap:anywhere}
.vo{color:var(--muted);font-size:14px}
.vval{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.vval>div{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Segmentos e chips */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-radius:14px;padding:4px;gap:4px;border:2px solid var(--line)}
.seg button{min-height:48px;border:0;border-radius:10px;background:transparent;font-weight:700;font-size:16px;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip:disabled{opacity:.35;cursor:default}
.chip.tall{flex-direction:column;justify-content:center;align-items:flex-start;padding:6px 16px;border-radius:14px;min-height:60px;gap:0}
.chip.tall small{font-weight:400;font-size:14px;opacity:.85}
.chip.n{min-width:52px;justify-content:center;padding:0 10px}

/* Linhas de lista */
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);border:0;text-align:left;width:100%;min-height:68px}
.rmain{min-width:0;display:flex;flex-direction:column;gap:2px}
.rt{font-weight:700;font-size:18px;overflow-wrap:anywhere}
.rs{color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.rend{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-variant-numeric:tabular-nums}
.rend b{white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);display:block}
.dots i.p{background:var(--good);border-color:var(--good)}
.dots i.l{border-color:var(--bad);background:var(--bad-soft)}
.forn{display:flex;flex-direction:column;gap:8px;background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.forn>button{background:none;border:0;text-align:left;padding:0;display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:48px}
.phones{display:flex;flex-wrap:wrap;gap:8px}
.phone{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);font-weight:700;font-variant-numeric:tabular-nums;text-decoration:none;color:var(--ink)}
.phone .ico{width:18px;height:18px;color:var(--brand)}
.group{display:flex;flex-direction:column;gap:8px}
.ghead{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:4px 2px 0}
.ghead h3{display:flex;align-items:center;gap:8px}
.ghead b{font-variant-numeric:tabular-nums}

/* Busca */
.search{position:relative}
.search>.ico{position:absolute;left:14px;top:16px;color:var(--muted);pointer-events:none}
.search input{padding-left:46px}

/* Formulários */
input,select,textarea{min-height:56px;font:inherit;font-size:18px;border:2px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
textarea{padding:12px 14px;min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-weight:700;font-size:16px}
.inrow{display:flex;gap:8px;align-items:stretch;min-width:0}
.mic{display:none;width:56px;min-height:56px;border-radius:12px;border:0;background:var(--sun-soft);color:var(--sun-ink);align-items:center;justify-content:center;flex:none}
body.has-mic .mic{display:inline-flex}
.mic.on{background:var(--bad);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--bad-soft)}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.cat{min-height:88px;border-radius:16px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:15px}
.cat .ico{width:30px;height:30px}
.cat.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--brand-soft);border-radius:14px;padding:12px 14px}
.ctx{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:6px 12px;border-radius:999px;align-self:flex-start}
.ctx .ico{width:20px;height:20px}
.total{display:flex;flex-direction:column;background:var(--surface);border-radius:14px;padding:12px 14px;border:2px solid var(--brand)}
.total span{font-weight:700;color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.05em}
.total b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.total small{color:var(--muted)}
.parc{display:flex;flex-direction:column;gap:10px;background:var(--surface2);border-radius:16px;padding:14px;border:2px solid var(--line)}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:grid;grid-template-columns:34px 1fr auto auto;gap:10px;align-items:center;background:var(--surface);border-radius:12px;padding:8px 10px;min-height:56px;font-variant-numeric:tabular-nums}
.prow .pn{font-weight:700;color:var(--muted)}
.prow .pd{font-weight:700}
.prow.paid{background:var(--good-soft)}
.prow.late .pd{color:var(--bad)}
.picklist{display:flex;flex-direction:column;gap:8px}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:64px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);text-align:left}
.pick:disabled{opacity:.5}

/* Gaveta (sheet) */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;background:var(--bg);width:100%;max-width:680px;max-height:calc(100% - env(safe-area-inset-top,0px) - 8px);border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:subir .18s ease-out}
@keyframes subir{from{transform:translateY(30px);opacity:.6}}
.sheet-head{display:flex;align-items:center;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-head h2{flex:1;min-width:0}
.sheet-body{overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
.sheet-foot{display:flex;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface)}
.sheet-foot .btn.big{flex:1}
.sheet-foot .btn.danger{flex:none;min-height:64px;padding:0 18px}

/* Pagamento */
.paycard{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.pq{font-weight:700;font-size:20px}
.po{color:var(--muted)}
.pv{font-family:var(--display);font-weight:800;font-size:38px;font-variant-numeric:tabular-nums}
.paybtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.pay{min-height:96px;flex-direction:column;font-size:21px;border-radius:18px;gap:6px}
.btn.pay .ico{width:32px;height:32px}
.btn.pix{background:var(--brand);color:var(--brand-ink)}
.btn.cash{background:var(--sun);color:#2A1E00}
.done{display:flex;gap:10px;align-items:center;background:var(--good-soft);color:var(--good);font-weight:700;padding:14px;border-radius:14px}

/* Lista de embarque */
.manifest{display:flex;flex-direction:column;gap:14px}
.manifest ol{margin:6px 0 0;padding-left:26px;display:flex;flex-direction:column;gap:6px}
.manifest li span{color:var(--muted);font-size:15px}

/* Abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.tabs button{min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:700;color:var(--muted);background:none;border:0;min-width:0}
.tabs button .ico{width:28px;height:28px}
.tabs button.on{color:var(--brand)}
.tabs button.on .ico{background:var(--brand-soft);border-radius:10px;width:52px;padding:2px 12px;box-sizing:content-box}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:80;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--bad);color:#fff}
.toast.live{background:var(--sun);color:#2A1E00}
.back{display:flex;align-items:center;gap:12px}
.back h1{flex:1;min-width:0;overflow-wrap:anywhere}
.more{background:none;border:0;color:var(--brand);font-weight:700;min-height:48px;font-size:17px}

const tipoQuarto = t => ({single: 'single', duplo: 'duplo', triplo: 'triplo', quadruplo: 'quadruplo'})[norm(t)] || '';

function corpo() {
  if (!META.iniciado) return `<div class="welcome"><h1>Olá, Lusia!</h1><p>Aqui você controla suas viagens: quem vai, quanto cada um já pagou, quanto falta pagar aos fornecedores e o lucro de cada viagem.</p><p>Tudo fica guardado neste celular e funciona sem internet.</p>
    <button class="btn pri big" data-act="comecar">${ic('check')} Começar do zero</button>
    <button class="btn sec big" data-act="comecarExemplo">Ver com exemplos</button>
    <button class="more" data-act="restaurar">Tenho uma cópia de segurança</button></div>`;
  if (UI.tab === 'viagens') return UI.viagemId && viagemDe(UI.viagemId) ? viewViagem(viagemDe(UI.viagemId)) : viewViagens();
  if (UI.tab === 'clientes') return viewClientes();
  if (UI.tab === 'fornecedores') return viewFornecedores();
  return viewInicio();
}
function nav() {
  const T = [['inicio', 'home', 'Início'], ['viagens', 'bus', 'Viagens'], ['clientes', 'users', 'Clientes'], ['fornecedores', 'store', 'Fornecedores']];
  return `<nav class="tabs" aria-label="Seções">${T.map(([k, i, l]) => `<button class="${UI.tab === k ? 'on' : ''}" data-act="tab" data-tab="${k}" ${UI.tab === k ? 'aria-current="page"' : ''}>${ic(i)}<span>${l}</span></button>`).join('')}</nav>`;
}

/* ----- Início ----- */
function viewInicio() {
  const h = hoje(), em30 = addDays(h, 30);
  const vs = vencimentos();
  const rec = vs.filter(v => v.tipo === 'r'), pag = vs.filter(v => v.tipo === 'p');
  const futuras = S.viagens.filter(v => fase(v) !== 'passada').sort(byIda);
  const lucro = soma(futuras.map(v => resumo(v).lucro));
  const atrR = rec.filter(v => v.venc < h), atrP = pag.filter(v => v.venc < h);
  const tiles = `<div class="tiles">
    <div class="tile rec"><div class="tl">${ic('down')} A receber</div><div class="tv">${money(soma(rec.map(v => v.valor)))}</div><small>${money(soma(rec.filter(v => v.venc <= em30).map(v => v.valor)))} nos próximos 30 dias${atrR.length ? ` · <b class="t-bad">${plural(atrR.length, 'atrasada', 'atrasadas')}</b>` : ''}</small></div>
    <div class="tile pag"><div class="tl">${ic('up')} A pagar</div><div class="tv">${money(soma(pag.map(v => v.valor)))}</div><small>${money(soma(pag.filter(v => v.venc <= em30).map(v => v.valor)))} nos próximos 30 dias${atrP.length ? ` · <b class="t-bad">${plural(atrP.length, 'atrasada', 'atrasadas')}</b>` : ''}</small></div>
    <div class="tile luc"><div class="tl">${ic('chart')} Lucro previsto</div><div class="tv ${lucro < 0 ? 't-bad' : ''}">${money(lucro)}</div><small>${plural(futuras.length, 'viagem programada', 'viagens programadas')}</small></div>
  </div>`;
  let lista = vs.filter(v => UI.vf === 'tudo' || (UI.vf === 'r' ? v.tipo === 'r' : v.tipo === 'p'));
  const total = lista.length;
  if (!UI.vmais) lista = lista.filter(v => v.venc <= em30).slice(0, 8);
  const vencHtml = lista.length ? lista.map(vencItem).join('') : `<div class="empty"><p>${total ? 'Nada vence nos próximos 30 dias.' : 'Nenhuma parcela em aberto.'}</p></div>`;
  const mais = total > lista.length || UI.vmais ? `<button class="more" data-act="vmais">${UI.vmais ? 'Mostrar só os próximos 30 dias' : `Ver todos (${total})`}</button>` : '';
  const ult = META.ultimoBackup ? `Última cópia: ${fmtDL(META.ultimoBackup)}.` : 'Nenhuma cópia feita ainda.';
  const podeEnviar = !!(navigator.share && navigator.canShare);
  return tiles + `
  <section class="list" aria-labelledby="h-venc">
    <h2 id="h-venc">Próximos vencimentos</h2>
    <div class="seg">${[['tudo', 'Tudo'], ['r', 'Receber'], ['p', 'Pagar']].map(([k, l]) => `<button class="${UI.vf === k ? 'on' : ''}" data-act="vf" data-v="${k}">${l}</button>`).join('')}</div>
    ${vencHtml}${mais}
  </section>
  <section class="list" aria-labelledby="h-prox">
    <div class="sechead"><h2 id="h-prox">Próximas viagens</h2>${futuras.length > 3 ? `<button class="more" data-act="tab" data-tab="viagens">Ver todas</button>` : ''}</div>
    ${futuras.slice(0, 3).map(ticket).join('') || `<div class="empty"><p>Nenhuma viagem programada.</p></div>`}
    <button class="btn sec big" data-act="novaViagem">${ic('plus')} Nova viagem</button>
  </section>
  <section class="backup" aria-labelledby="h-bkp">
    <h2 id="h-bkp">Cópia de segurança</h2>
    <p class="hint">Os dados ficam só neste celular. Faça uma cópia toda semana e guarde no Google Drive ou mande para você no WhatsApp. ${ult}</p>
    ${UI.restaurar ? `<div class="aviso">Isso troca TODOS os dados atuais pelos da cópia de ${fmtDL(UI.restaurar.data)} (${plural(UI.restaurar.dados.viagens.length, 'viagem', 'viagens')}, ${plural(UI.restaurar.dados.clientes.length, 'cliente', 'clientes')}).</div><div class="btnrow"><button class="btn danger" data-act="confirmarRestaurar">Trocar pelos dados da cópia</button><button class="btn sec" data-act="cancelarRestaurar">Cancelar</button></div>` : `
    <div class="btnrow"><button class="btn pri" data-act="backup">${ic('save')} Salvar cópia</button>${podeEnviar ? `<button class="btn sec" data-act="enviarBackup">${ic('share')} Enviar cópia</button>` : ''}<button class="btn sec" data-act="restaurar">${ic('upload')} Restaurar</button></div>`}
  </section>`;
}
function vencItem(v) {
  const h = hoje(); const late = v.venc < h; const dd = diffDays(h, v.venc);
  const [, m, d] = v.venc.split('-').map(Number);
  const q = late ? `<b class="t-bad">atrasada ${plural(-dd, 'dia', 'dias')}</b>` : dd === 0 ? '<b>vence hoje</b>' : dd === 1 ? 'vence amanhã' : `em ${dd} dias`;
  return `<div class="venc ${late ? 'late' : ''}">
    <div class="vdate"><b>${d}</b><span>${MES[m - 1]}</span></div>
    <div class="vinfo"><div class="vq">${esc(v.quem)}</div><div class="vo">${esc(v.onde)} · ${v.n}/${v.de} · ${q}</div></div>
    <div class="vval"><div class="${v.tipo === 'r' ? 't-good' : 't-bad'}">${v.tipo === 'r' ? '+' : '−'} ${money(v.valor)}</div>
    <button class="btn sm ${v.tipo === 'r' ? 'pri' : 'sec'}" data-act="pagar" data-col="${v.col}" data-id="${esc(v.id)}" data-i="${v.idx}">${v.tipo === 'r' ? 'Receber' : 'Pagar'}</button></div>
  </div>`;
}
function barra(label, a, b, cls) { const p = b > 0 ? Math.min(1, a / b) : 0; return `<div class="mini"><span>${label}</span><div class="bar"><i class="${cls || ''}" style="width:${(p * 100).toFixed(1)}%"></i></div><span>${Math.round(p * 100)}%</span></div>`; }
function ticket(vi) {
  const r = resumo(vi); const [y, m, d] = vi.ida.split('-').map(Number);
  return `<button class="ticket" data-act="abrirViagem" data-id="${esc(vi.id)}">
    <div class="stub ${fase(vi) === 'passada' ? 'passada' : ''}"><span class="d">${d}</span><span class="m">${MES[m - 1]}</span><span class="y">${y}</span></div>
    <div class="tbody">
      <div class="tdest">${esc(vi.destino)}</div>
      <div class="tmeta">${periodo(vi)} · ${quando(vi)}</div>
      <div class="tstats"><span>${ic('users')} ${r.pax}</span><span class="${r.lucro >= 0 ? 't-good' : 't-bad'}">Lucro ${money(r.lucro)}</span></div>
      ${barra('Recebido', r.recebido, r.receita)}
      ${barra('Pago', r.pagoF, r.custo, 'brand')}
    </div></button>`;
}

/* ----- Viagens ----- */
function viewViagens() {
  const fut = S.viagens.filter(v => fase(v) !== 'passada').sort(byIda);
  const pas = S.viagens.filter(v => fase(v) === 'passada').sort(byIda).reverse();
  return `<div class="sechead"><h1>Viagens</h1><span class="count">${S.viagens.length}</span></div>
  <button class="btn pri big" data-act="novaViagem">${ic('plus')} Nova viagem</button>
  <div class="list">${fut.map(ticket).join('') || `<div class="empty"><p>Nenhuma viagem programada.</p></div>`}</div>
  ${pas.length ? `<button class="more" data-act="passadas">${UI.passadas ? 'Esconder viagens concluídas' : `Ver viagens concluídas (${pas.length})`}</button>${UI.passadas ? `<div class="list">${pas.map(ticket).join('')}</div>` : ''}` : ''}`;
}
function viewViagem(vi) {
  const r = resumo(vi); const vs = vendasDe(vi.id); const cs = custosDe(vi.id);
  const margem = r.receita > 0 ? Math.round(r.lucro / r.receita * 100) : 0;
  const pR = r.receita > 0 ? r.recebido / r.receita : 0, pP = r.custo > 0 ? r.pagoF / r.custo : 0;
  const h = hoje();
  const proxR = vs.flatMap(v => (v.parcelas || []).filter(p => !p.pago)).sort((a, b) => a.venc.localeCompare(b.venc))[0];
  const proxP = cs.flatMap(c => (c.parcelas || []).filter(p => !p.pago)).sort((a, b) => a.venc.localeCompare(b.venc))[0];
  const head = `<div class="back"><button class="iconbtn" data-act="voltarViagens" aria-label="Voltar para viagens">${ic('back')}</button><h1>${esc(vi.destino)}</h1><button class="iconbtn" data-act="editViagem" aria-label="Editar viagem">${ic('edit')}</button></div>
  <div class="tmeta" style="margin-top:-8px">${fmtDL(vi.ida)}${vi.volta && vi.volta !== vi.ida ? ' até ' + fmtDL(vi.volta) : ''} · ${quando(vi)}${vi.obs ? ' · ' + esc(vi.obs) : ''}</div>`;
  const kpis = `<div class="kpis">
    <div class="kpi"><span>Vendas</span><b>${money(r.receita)}</b><small>${plural(r.pax, 'passageiro', 'passageiros')}</small></div>
    <div class="kpi"><span>Custos</span><b>${money(r.custo)}</b><small>${plural(r.nCustos, 'item', 'itens')}</small></div>
    <div class="kpi lucro ${r.lucro < 0 ? 'neg' : ''}"><span>Lucro previsto</span><b>${money(r.lucro)}</b><small>${margem}% das vendas</small></div>
    <div class="kpi"><span>Em caixa hoje</span><b class="${r.recebido - r.pagoF < 0 ? 't-bad' : ''}">${money(r2(r.recebido - r.pagoF))}</b><small>recebido − pago</small></div>
  </div>
  <div class="prog">
    <div class="pl"><span>Recebido dos clientes</span><b>${money(r.recebido)} <small>de ${money(r.receita)}</small></b></div>
    <div class="bar big"><i style="width:${(pR * 100).toFixed(1)}%"></i></div>
    ${proxR ? `<p class="hint">Próximo a receber: ${fmtD(proxR.venc)} · ${money(proxR.valor)}${proxR.venc < h ? ' (atrasado)' : ''}</p>` : (r.receita > 0 ? '<p class="hint">Tudo recebido.</p>' : '')}
    <div class="pl" style="margin-top:6px"><span>Pago aos fornecedores</span><b>${money(r.pagoF)} <small>de ${money(r.custo)}</small></b></div>
    <div class="bar big"><i class="brand" style="width:${(pP * 100).toFixed(1)}%"></i></div>
    ${proxP ? `<p class="hint">Próximo a pagar: ${fmtD(proxP.venc)} · ${money(proxP.valor)}${proxP.venc < h ? ' (atrasado)' : ''}</p>` : (r.custo > 0 ? '<p class="hint">Fornecedores todos pagos.</p>' : '')}
  </div>`;
  const seg = `<div class="seg">${[['pass', `Passageiros (${vs.length})`], ['custos', `Custos (${cs.length})`]].map(([k, l]) => `<button class="${UI.vt === k ? 'on' : ''}" data-act="vt" data-v="${k}">${l}</button>`).join('')}</div>`;
  let lista;
  if (UI.vt === 'custos') {
    const grupos = Object.keys(CATS).map(k => ({k, itens: cs.filter(c => c.categoria === k)})).filter(g => g.itens.length);
    lista = `<button class="btn pri big" data-act="novoCusto">${ic('plus')} Novo custo</button>` +
      (grupos.length ? grupos.map(g => `<div class="group"><div class="ghead"><h3>${ic(CATS[g.k].icon)} ${CATS[g.k].nome}</h3><b>${money(soma(g.itens.map(c => c.total)))}</b></div>${g.itens.map(custoRow).join('')}</div>`).join('') : `<div class="empty"><p>Nenhum custo lançado. Toque em Novo custo.</p></div>`);
  } else {
    const qs = Object.keys(QUARTOS).map(k => [k, vs.filter(v => v.quarto === k).length]).filter(x => x[1]);
    lista = `<div class="btnrow"><button class="btn pri big" data-act="novaVenda">${ic('plus')} Passageiro</button>${vs.length ? `<button class="btn sec" style="flex:0 1 auto;min-height:64px" data-act="lista">${ic('list')} Lista</button>` : ''}</div>` +
      (qs.length ? `<p class="hint">${qs.map(([k, n]) => `${QUARTOS[k].nome}: ${plural(n, 'pessoa', 'pessoas')} (${plural(Math.ceil(n / QUARTOS[k].cap), 'quarto', 'quartos')})`).join(' · ')}</p>` : '') +
      (vs.length ? vs.slice().sort((a, b) => nomeVenda(a).localeCompare(nomeVenda(b), 'pt')).map(vendaRow).join('') : `<div class="empty"><p>Ninguém nesta viagem ainda. Toque em Passageiro.</p></div>`);
  }
  return head + kpis + seg + `<div class="list">${lista}</div>`;
}
function vendaRow(v) {
  return `<button class="row" data-act="editVenda" data-id="${esc(v.id)}"><div class="rmain"><div class="rt">${esc(nomeVenda(v))}</div><div class="rs">${esc(v.embarque || 'sem embarque')} · ${(QUARTOS[v.quarto] || {}).nome || '—'}</div>${dots(v.parcelas)}</div><div class="rend"><b>${money(v.valor)}</b>${pill(v.parcelas)}</div></button>`;
}
function custoRow(c) {
  const f = fornDe(c.fornecedorId);
  return `<button class="row" data-act="editCusto" data-id="${esc(c.id)}"><div class="rmain"><div class="rt">${esc(c.subtipo || CATS[c.categoria].nome)}${c.descricao ? ` <span class="t-muted" style="font-weight:400">· ${esc(c.descricao)}</span>` : ''}</div><div class="rs">${esc(f ? f.empresa : 'sem fornecedor')} · ${esc(formula(c))}</div>${dots(c.parcelas)}</div><div class="rend"><b>${money(c.total)}</b>${pill(c.parcelas)}</div></button>`;
}
function formula(c) {
  const q = num(c.qtd), u = num(c.unit), n = num(c.vezes) || 1;
  if (c.categoria === 'hotel') return `${plural(q, 'quarto', 'quartos')} × ${plural(n, 'noite', 'noites')} × ${money(u)}`;
  if (c.categoria === 'alimentacao') return `${plural(q, 'pessoa', 'pessoas')} × ${n} refeiç${n === 1 ? 'ão' : 'ões'} × ${money(u)}`;
  if (c.categoria === 'passeios') return `${plural(q, 'pessoa', 'pessoas')} × ${money(u)}`;
  return `${q} × ${money(u)}`;
}

/* ----- Clientes ----- */
function viewClientes() {
  return `<div class="sechead"><h1>Clientes</h1><span class="count">${S.clientes.length}</span></div>
  <button class="btn pri big" data-act="novoCliente">${ic('plus')} Novo cliente</button>
  <div class="search inrow">${ic('search')}<input id="buscaCli" data-busca="clientes" data-kind="busca" placeholder="Buscar nome, CPF ou embarque" value="${esc(UI.busca.clientes)}" autocomplete="off" aria-label="Buscar cliente">${micBtn('buscaCli')}</div>
  <div class="list" id="lista">${listaClientes()}</div>`;
}
function listaClientes() {
  const q = norm(UI.busca.clientes), qd = digits(UI.busca.clientes);
  const arr = S.clientes.filter(c => !q || norm(c.nome).includes(q) || norm(c.embarque).includes(q) || (qd && digits(c.cpf).includes(qd))).sort(byNome('nome'));
  if (!arr.length) return `<div class="empty"><p>${S.clientes.length ? 'Ninguém encontrado.' : 'Nenhum cliente cadastrado ainda.'}</p></div>`;
  return arr.map(c => { const n = S.vendas.filter(v => v.clienteId === c.id).length; return `<button class="row" data-act="editCli" data-id="${esc(c.id)}"><div class="rmain"><div class="rt">${esc(c.nome)}</div><div class="rs">${c.cpf ? 'CPF ' + esc(c.cpf) : 'sem CPF'}${c.embarque ? ' · ' + esc(c.embarque) : ''}</div></div><div class="rend"><span class="pill">${plural(n, 'viagem', 'viagens')}</span></div></button>`; }).join('');
}

/* ----- Fornecedores ----- */
function viewFornecedores() {
  return `<div class="sechead"><h1>Fornecedores</h1><span class="count">${S.fornecedores.length}</span></div>
  <button class="btn pri big" data-act="novoForn">${ic('plus')} Novo fornecedor</button>
  <div class="search inrow">${ic('search')}<input id="buscaForn" data-busca="fornecedores" data-kind="busca" placeholder="Buscar empresa ou cidade" value="${esc(UI.busca.fornecedores)}" autocomplete="off" aria-label="Buscar fornecedor">${micBtn('buscaForn')}</div>
  <div class="list" id="lista">${listaFornecedores()}</div>`;
}
function listaFornecedores() {
  const q = norm(UI.busca.fornecedores);
  const arr = S.fornecedores.filter(f => !q || norm(f.empresa).includes(q) || norm(f.cidade).includes(q) || norm(f.responsavel).includes(q)).sort(byNome('empresa'));
  if (!arr.length) return `<div class="empty"><p>${S.fornecedores.length ? 'Nenhum encontrado.' : 'Nenhum fornecedor cadastrado ainda.'}</p></div>`;
  return arr.map(f => {
    const tels = [f.cel1, f.cel2, f.cel3].filter(Boolean);
    return `<div class="forn"><button data-act="editForn" data-id="${esc(f.id)}"><span class="rmain"><span class="rt">${esc(f.empresa)}</span><span class="rs">${esc([f.cidade, f.responsavel].filter(Boolean).join(' · ') || '—')}</span></span>${f.categoria && CATS[f.categoria] ? `<span class="pill">${CATS[f.categoria].nome}</span>` : ''}</button>
    ${tels.length ? `<div class="phones">${tels.map(t => `<a class="phone" href="tel:${digits(t)}">${ic('phone')} ${esc(t)}</a>`).join('')}</div>` : ''}</div>`;
  }).join('');
}

/* ---------- gavetas (formulários) ---------- */
const micBtn = id => `<button type="button" class="mic" data-act="mic" data-mic-for="${id}" aria-label="Falar para preencher">${ic('mic')}</button>`;
function field(f, label, kind, value, ph, o) {
  o = o || {};
  const id = 'f_' + f.replace(/\./g, '_');
  const im = {cpf: 'numeric', tel: 'tel', money: 'decimal', int: 'numeric'}[kind];
  return `<label class="fld" for="${id}"><span class="lbl">${label}</span><span class="inrow"><input id="${id}" type="${kind === 'date' ? 'date' : 'text'}" data-f="${f}" data-kind="${kind}" ${im ? `inputmode="${im}"` : ''} ${o.recalc ? 'data-recalc="1"' : ''} value="${esc(value ?? '')}" placeholder="${esc(ph || '')}" autocomplete="off">${o.nomic ? '' : micBtn(id)}</span>${o.after || ''}</label>`;
}
function setPath(o, p, v) { const ks = p.split('.'); let t = o; for (let i = 0; i < ks.length - 1; i++) { t[ks[i]] = t[ks[i]] || {}; t = t[ks[i]]; } t[ks[ks.length - 1]] = v; }
function openSheet(kind, data, push) {
  pararMic();
  if (F && push) stack.push(F); else stack.length = 0;
  F = {kind, ...data};
  renderSheet(true);
}
function closeSheet() {
  pararMic();
  if (stack.length) {
    F = stack.pop();
    if (F.id && (F.kind === 'venda' || F.kind === 'custo')) { const doc = getDoc(F.kind === 'venda' ? 'vendas' : 'custos', F.id); if (doc) { F.parc.lista = (doc.parcelas || []).map(p => ({...p})); F.parc.n = F.parc.lista.length || 1; } }
    renderSheet(true);
  } else {
    F = null; const el = $('#sheet'); el.hidden = true; el.innerHTML = ''; document.body.classList.remove('lock');
    agendar();
  }
}
function renderSheet(top) {
  const el = $('#sheet'); const old = el.querySelector('.sheet-body'); const sc = old ? old.scrollTop : 0;
  const h = SHEETS[F.kind]();
  keepFocus(() => {
    el.innerHTML = `<div class="scrim"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(h.title)}"><header class="sheet-head"><button class="iconbtn" data-act="fechar" aria-label="Voltar">${ic('back')}</button><h2>${esc(h.title)}</h2></header><div class="sheet-body">${h.body}</div>${h.foot ? `<footer class="sheet-foot">${h.foot}</footer>` : ''}</section>`;
  });
  el.hidden = false; document.body.classList.add('lock');
  const nb = el.querySelector('.sheet-body'); if (nb) nb.scrollTop = top ? 0 : sc;
  marcarMic();
}
const footSalvar = () => `${F.id ? `<button class="btn danger" data-act="excluir">${F._del ? 'Confirmar exclusão' : ic('trash') + '<span class="sr">Excluir</span>'}</button>` : ''}<button class="btn pri big" data-act="salvar">${ic('check')} Salvar</button>`;
function embarquesConhecidos(extra) {
  const m = new Map();
  (extra || []).forEach(e => { if (e && !m.has(norm(e))) m.set(norm(e), e); });
  S.clientes.forEach(c => { if (c.embarque && !m.has(norm(c.embarque))) m.set(norm(c.embarque), c.embarque); });
  S.vendas.forEach(v => { if (v.embarque && !m.has(norm(v.embarque))) m.set(norm(v.embarque), v.embarque); });
  return [...m.values()].slice(0, 10);
}
function chipsSet(f, opts, cur) { return opts.length ? `<div class="chips">${opts.map(o => `<button class="chip ${cur === o ? 'on' : ''}" data-act="set" data-f="${f}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>` : ''; }

const SHEETS = {
  cliente() {
    const ok = !F.cpf || digits(F.cpf).length < 11 || cpfValido(F.cpf);

function pickList() {
  const q = norm(F.busca), qd = digits(F.busca);
  const ja = new Set(vendasDe(F.viagemId).map(v => v.clienteId));
  const arr = S.clientes.filter(c => !q || norm(c.nome).includes(q) || (qd && digits(c.cpf).includes(qd))).sort(byNome('nome')).slice(0, 60);
  if (!arr.length) return `<div class="empty"><p>${S.clientes.length ? 'Ninguém com esse nome. Cadastre um cliente novo.' : 'Nenhum cliente ainda. Cadastre o primeiro.'}</p></div>`;
  return arr.map(c => `<button class="pick" data-act="pickCli" data-id="${esc(c.id)}" ${ja.has(c.id) ? 'disabled' : ''}><span class="rt">${esc(c.nome)}</span><span class="rs">${ja.has(c.id) ? 'já está nesta viagem' : [c.cpf ? 'CPF ' + c.cpf : '', c.embarque].filter(Boolean).map(esc).join(' · ')}</span></button>`).join('');
}
function formTotal() { return F.kind === 'venda' ? r2(num(F.valor)) : totalCusto(F); }
function totalCusto(f) { const q = num(f.qtd), u = num(f.unit); const n = (f.categoria === 'hotel' || f.categoria === 'alimentacao') ? (num(f.vezes) || 1) : 1; return r2(q * u * n); }
function totalHtml() { return `<span>Total deste custo</span><b>${money(totalCusto(F))}</b><small>${esc(formula({...F, qtd: num(F.qtd), unit: num(F.unit), vezes: num(F.vezes)}))}</small>`; }
function regen() { if (!F.parc) return; F.parc.lista = gerarParcelas(formTotal(), F.parc.n, F.parc.primeiro || hoje(), F.parc.lista); }
function parcBox() {
  const p = F.parc; const total = formTotal(); const vi = viagemDe(F.viagemId);
  const limite = F.kind === 'venda' && vi ? vi.ida : null;
  const pagas = p.lista.filter(x => x.pago);
  const restante = r2(total - soma(pagas.map(x => x.valor)));
  const minN = Math.max(1, pagas.length + (restante > 0.004 ? 1 : 0));
  const maxN = limite ? pagas.length + maxAbertas(p.primeiro, limite) : 12;
  const h = hoje();
  if (total <= 0) return `<div class="parc"><span class="lbl">Parcelas</span><p class="hint">Informe o valor para montar as parcelas.</p></div>`;
  let avisos = '';
  if (limite && p.primeiro >= limite && restante > 0.004) avisos += `<div class="aviso">O vencimento precisa ser antes da viagem (${fmtD(limite)}).</div>`;
  else if (limite && p.lista.some(x => !x.pago && x.venc >= limite)) avisos += `<div class="aviso">Tem parcela vencendo depois da viagem. Diminua o número de vezes.</div>`;
  if (restante < -0.004) avisos += `<div class="aviso">Já foi pago mais que o valor total.</div>`;
  const chips = Array.from({length: 12}, (_, i) => i + 1).map(n => `<button class="chip n ${p.n === n ? 'on' : ''}" data-act="setN" data-v="${n}" ${n < minN || (n > maxN && n !== p.n) ? 'disabled' : ''}>${n}x</button>`).join('');
  const rows = p.lista.map((x, i) => {
    const late = !x.pago && x.venc < h;
    return `<div class="prow ${x.pago ? 'paid' : ''} ${late ? 'late' : ''}"><span class="pn">${i + 1}ª</span><span class="pd">${fmtD(x.venc)}${late ? ' · atrasada' : ''}</span><b>${money(x.valor)}</b><button class="btn sm ${x.pago ? 'sec' : 'pri'}" data-act="pagarParcela" data-i="${i}">${x.pago ? (FORMA[x.forma] || 'Pago') + ' ✓' : (F.kind === 'venda' ? 'Receber' : 'Pagar')}</button></div>`;
  }).join('');
  return `<div class="parc">
    <span class="lbl">Em quantas vezes?</span>
    <div class="chips">${chips}</div>
    ${field('parc.primeiro', pagas.length ? 'Próximo vencimento' : '1º vencimento', 'date', p.primeiro, '', {recalc: true})}
    ${limite ? `<p class="hint">Tudo precisa estar pago antes da viagem (${fmtDL(limite)}). Dá para fazer em até ${maxN}x.</p>` : ''}
    ${avisos}
    <div class="plist">${rows}</div>
  </div>`;
}
function recalc() {
  if (F.kind !== 'venda' && F.kind !== 'custo') return;
  regen();
  const pb = $('#parcBox'); if (pb) keepFocus(() => { pb.innerHTML = parcBox(); });
  const tb = $('#totalBox'); if (tb) tb.innerHTML = totalHtml();
  marcarMic();
}

/* ---------- salvar ---------- */
const SALVAR = {
  cliente() {
    const nome = str(F.nome); if (!nome) return toast('Escreva o nome do cliente', 'bad');
    const cpf = fmtCPF(F.cpf);
    if (cpf && digits(cpf).length !== 11) return toast('O CPF precisa ter 11 números', 'bad');
    if (cpf) { const dup = S.clientes.find(c => c.id !== F.id && digits(c.cpf) === digits(cpf)); if (dup) return toast(`Esse CPF já é de ${dup.nome}`, 'bad'); }
    const id = F.id || uid(); const ant = F.id ? clienteDe(F.id) : null;
    const ok = gravar(() => setDoc('clientes', id, {...(ant || {}), nome, cpf, tel: fmtTel(F.tel), embarque: str(F.embarque)}), F.id ? 'Cliente atualizado' : 'Cliente cadastrado');
    if (!ok) return;
    if (stack.length && stack[stack.length - 1].kind === 'venda') { F = stack.pop(); pickCliente(id); }
    else closeSheet();
  },
  fornecedor() {
    const empresa = str(F.empresa); if (!empresa) return toast('Escreva o nome da empresa', 'bad');
    const id = F.id || uid(); const ant = F.id ? fornDe(F.id) : null;
    const ok = gravar(() => setDoc('fornecedores', id, {...(ant || {}), empresa, cidade: str(F.cidade), responsavel: str(F.responsavel), cel1: fmtTel(F.cel1), cel2: fmtTel(F.cel2), cel3: fmtTel(F.cel3), categoria: F.categoria || ''}), F.id ? 'Fornecedor atualizado' : 'Fornecedor cadastrado');
    if (!ok) return;
    if (stack.length && stack[stack.length - 1].kind === 'custo') { F = stack.pop(); F.fornecedorId = id; renderSheet(); }
    else closeSheet();
  },
  viagem() {
    const destino = str(F.destino); if (!destino) return toast('Escreva o destino', 'bad');
    const ida = isoOk(F.ida); if (!ida) return toast('Escolha a data de ida', 'bad');
    const volta = isoOk(F.volta) || ida; if (volta < ida) return toast('A volta está antes da ida', 'bad');

function registrarPagamento(forma) {
  const doc = getDoc(F.col, F.docId); if (!doc) return;
  const ps = (doc.parcelas || []).map(p => ({...p})); const p = ps[F.idx];
  if (!p || p.pago) return;
  const valor = r2(num(F.valor)); if (!(valor > 0)) return toast('Informe o valor', 'bad');

  else if (valor > p.valor + 0.004) {
    let extra = r2(valor - p.valor); p.valor = valor;
    for (let i = ps.length - 1; i >= 0 && extra > 0.004; i--) { if (i === F.idx || ps[i].pago) continue; const tira = Math.min(extra, ps[i].valor); ps[i].valor = r2(ps[i].valor - tira); extra = r2(extra - tira); }
    for (let i = ps.length - 1; i >= 0; i--) if (!ps[i].pago && ps[i].valor <= 0.004) ps.splice(i, 1);
  }
  Object.assign(p, {pago: true, forma, dataPago: data});
  const isR = F.col === 'vendas';
  const ok = gravar(() => setDoc(F.col, F.docId, {...doc, parcelas: ps}), `${isR ? 'Recebido' : 'Pago'} ${money(valor)} no ${FORMA[forma]}`);
  if (ok) closeSheet();
}

  const ok = gravar(() => setDoc(F.col, F.docId, {...doc, parcelas: ps}), 'Pagamento desfeito');
  if (ok) closeSheet();
}

function lerBackup(file) {

    try {
      const j = JSON.parse(fr.result);

/* ---------- microfone (reconhecimento de voz do celular) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, ouvindo = false, micTarget = null;
if (SR) document.body.classList.add('has-mic');
function marcarMic() { document.querySelectorAll('[data-mic-for]').forEach(b => b.classList.toggle('on', ouvindo && b.dataset.micFor === micTarget)); }
function pararMic() { if (rec && ouvindo) { try { rec.abort(); } catch (e) {} } ouvindo = false; }
function ligarMic(id) {
  if (!SR) return;
  if (ouvindo) { const mesmo = micTarget === id; pararMic(); marcarMic(); if (mesmo) return; }
  micTarget = id;
  rec = new SR();
  rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  if (!navigator.onLine && 'processLocally' in rec) { try { rec.processLocally = true; } catch (e) {} }
  rec.onstart = () => { ouvindo = true; marcarMic(); toast('Pode falar…', 'live'); };
  rec.onresult = ev => {
    let fin = '', par = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) { const r = ev.results[i]; if (r.isFinal) fin += r[0].transcript; else par += r[0].transcript; }
    if (par) toast('“' + par + '”', 'live');
    if (fin) { const el = document.getElementById(micTarget); if (el) aplicarDitado(el, fin); }
  };
  rec.onerror = ev => {
    const c = ev.error;
    if (c === 'not-allowed' || c === 'service-not-allowed') toast('Microfone bloqueado. Libere o microfone para este app nas configurações.', 'bad');
    else if (c === 'network') toast('Sem internet, o microfone do app não funcionou. Use o microfone do teclado.', 'bad');
    else if (c === 'no-speech') toast('Não ouvi nada. Toque no microfone e fale de novo.', 'bad');
    else if (c === 'language-not-supported') toast('O celular não reconhece português offline. Use o microfone do teclado.', 'bad');
    else if (c !== 'aborted') toast('O microfone falhou. Tente de novo.', 'bad');
  };
  rec.onend = () => { ouvindo = false; marcarMic(); const t = $('#toast'); if (t.classList.contains('live')) t.hidden = true; };
  try { rec.start(); } catch (e) { toast('Não deu para ligar o microfone.', 'bad'); }
  marcarMic();
}
function aplicarDitado(el, text) {
  const k = el.dataset.kind; let v;
  if (k === 'cpf') v = fmtCPF(text);
  else if (k === 'tel') v = fmtTel(text);
  else if (k === 'money') { const n = parseValor(text); if (n == null) return toast('Não entendi o valor. Fale só o número.', 'bad'); v = fmtNum(n); }
  else if (k === 'int') { const n = parseValor(text); if (n == null) return toast('Não entendi o número.', 'bad'); v = String(Math.round(n)); }
  else if (k === 'date') { const d = parseData(text); if (!d) return toast('Não entendi a data. Ex.: “15 de março”', 'bad'); v = d; }
  else if (k === 'busca') v = text.trim().replace(/[.!?]$/, '');
  else { const t = text.trim().replace(/[.!?]$/, ''); v = el.value.trim() ? el.value.trim() + ' ' + t : t; v = v.charAt(0).toUpperCase() + v.slice(1); }
  el.value = v;
  el.dispatchEvent(new Event('input', {bubbles: true}));
  el.dispatchEvent(new Event('change', {bubbles: true}));
}

  desfazerPag() { desfazerPagamento(); },
  salvar() { SALVAR[F.kind](); },
  excluir() { excluir(); },
  fechar() { closeSheet(); },
  mic(d) { ligarMic(d.micFor); },
  apagarExemplos() {
    if (!UI.confEx) { UI.confEx = true; render(); return; }
    UI.confEx = false;
    gravar(() => { COLS.forEach(c => { S[c] = S[c].filter(x => !x.exemplo); }); }, 'Exemplos apagados');
  },
  backup() { baixarBackup(); },
  enviarBackup() { enviarBackup(); },
  restaurar() { const i = $('#arqBackup'); i.value = ''; i.click(); },
  cancelarRestaurar() { UI.restaurar = null; render(); },
  confirmarRestaurar() {
    const j = UI.restaurar; if (!j) return;
    const ok = gravar(() => { COLS.forEach(c => { S[c] = j.dados[c]; }); META.iniciado = true; }, 'Dados restaurados');
    if (ok) { UI.restaurar = null; UI.viagemId = null; render(); window.scrollTo(0, 0); }
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(b.dataset, b, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.busca === 'clientes' || el.dataset.busca === 'fornecedores') {
    UI.busca[el.dataset.busca] = el.value;
    const l = $('#lista'); if (l) l.innerHTML = el.dataset.busca === 'clientes' ? listaClientes() : listaFornecedores();
    return;
  }
  if (!F || !el.closest('#sheet')) return;
  if (el.dataset.busca === 'venda') { F.busca = el.value; const l = $('#cliPick'); if (l) l.innerHTML = pickList(); return; }
  if (el.dataset.f) { setPath(F, el.dataset.f, el.value); if (el.dataset.recalc) recalc(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'arqBackup') { if (el.files && el.files[0]) lerBackup(el.files[0]); return; }
  if (!F || !el.dataset.f || !el.closest('#sheet')) return;
  const k = el.dataset.kind;
  if (k === 'cpf') { el.value = fmtCPF(el.value); setPath(F, el.dataset.f, el.value); const a = $('#cpfAviso'); if (a) a.innerHTML = (!el.value || digits(el.value).length < 11 || cpfValido(el.value)) ? '' : '<div class="aviso">Este CPF parece errado. Confira os números.</div>'; }
  if (k === 'tel') { el.value = fmtTel(el.value); setPath(F, el.dataset.f, el.value); }
  if (k === 'money' && el.value) { const n = parseValor(el.value); if (n != null) { el.value = fmtNum(n); setPath(F, el.dataset.f, el.value); } }
  if (el.tagName === 'SELECT') setPath(F, el.dataset.f, el.value);
});
window.addEventListener('popstate', () => { if (F) { closeSheet(); history.pushState(null, ''); } });

let tt = 0;
function toast(msg, tipo) { const el = $('#toast'); el.textContent = msg; el.className = 'toast ' + (tipo || ''); el.hidden = false; el.setAttribute('role', 'status'); clearTimeout(tt); tt = setTimeout(() => { el.hidden = true; }, tipo === 'live' ? 8000 : 2800); }

/* ---------- início ---------- */
carregar();
if (!META.iniciado && COLS.some(c => S[c].length)) META.iniciado = true;
render();
try { history.pushState(null, ''); } catch (e) {}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
